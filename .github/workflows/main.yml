# ─────────────────────────────────────────────────────────────
# Postman Collection Workflow
# Runs Postman API tests using Newman and uploads an HTML report
# as a GitHub Actions artifact after every run.
# ─────────────────────────────────────────────────────────────

name: Postman Collection Workflow

# ── TRIGGERS ──────────────────────────────────────────────────
# Defines when this workflow should run
on:

  # Runs automatically whenever code is pushed to the main branch
  push:
    branches: [main]

  # Allows you to manually trigger this workflow from the GitHub UI
  workflow_dispatch:

  # Scheduled runs using cron syntax (UTC time)
  # Cron format: minute hour day-of-month month day-of-week
  schedule:
    - cron: '30 02 * * *'    # Every day at 8:00 AM IST (02:30 UTC)
    - cron: '00 14 * * *'    # Every day at 7:30 PM IST (14:00 UTC)
    - cron: '00 06 * * 1-5'  # Weekdays (Mon–Fri) at 11:30 AM IST (06:00 UTC)

# ── JOBS ──────────────────────────────────────────────────────
# A workflow is made up of one or more jobs
jobs:

  # Job ID — used to reference this job elsewhere in the workflow
  run-postman-tests:

    # The type of machine to run this job on (GitHub-hosted Ubuntu runner)
    runs-on: ubuntu-latest

    # ── STEPS ───────────────────────────────────────────────
    # Each step is an individual task that runs in sequence
    steps:

      # Step 1: Pulls your repository code into the runner
      # so the workflow can access your collection & environment files
      - name: Checkout the code
        uses: actions/checkout@v4

      # Step 2: Sets up the specified version of Node.js on the runner
      # Newman is a Node.js tool, so this is required before installing it
      - name: Install Nodejs and npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Use Node.js version 22

      # Step 3: Installs Newman (Postman CLI runner) globally
      # Also installs newman-reporter-htmlextra to generate rich HTML reports
      - name: Install Newman and HTML Extra globally
        run: |
          npm install -g newman                    # Core Newman CLI
          npm install -g newman-reporter-htmlextra # HTML report generator plugin

      # Step 4: Runs the Postman collection using Newman
      # -e flag          → specifies the environment file
      # -r cli,htmlextra → outputs results to terminal (cli) AND as HTML report
      # --reporter-htmlextra-export → tells Newman WHERE to save the HTML file
      - name: Run the Postman Collection with newman
        run: |
          newman run Inwarranty-flow-Collection.postman_collection.json \
          -e QA.postman_environment.json \
          -r cli,htmlextra \
          --reporter-htmlextra-export ./newman/index.html

      # Step 5: Uploads the generated HTML report as a GitHub Actions artifact
      # if: always() → ensures this step runs even if the tests fail,
      # so you can always download and inspect the report regardless of outcome
      - name: Upload a Newman Run Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Postman Collection Newman Report  # Name shown in GitHub Actions UI
          path: newman/*.html                     # Path to the generated HTML report

      # Step 6: Deploys the HTML report to GitHub Pages so it's accessible via a public URL
      # if: always() → ensures deployment happens even when tests fail,
      # guaranteeing the latest report is always available online
      # peaceiris/actions-gh-pages → a popular action that pushes files to the gh-pages branch
      # github_token  → uses the built-in repo token for authentication (no manual setup needed)
      # publish_dir   → the local folder whose contents will be published to GitHub Pages
      - name: Creating github page branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: newman/

      # Step 7: Sends an email notification with a link to the live GitHub Pages report
      # if: always() → ensures the email is sent regardless of test pass/fail outcome,
      # so stakeholders are always informed of the latest results
      # dawidd6/action-send-mail → a widely-used action for sending emails via SMTP
      # server_address/port → uses Gmail's SMTP server on SSL port 465
      # username/password   → pulled from GitHub Secrets to keep credentials secure
      # NOTE: password must be a Gmail App Password, NOT your regular Gmail password
      # attachments (commented out) → can be re-enabled to attach the HTML file directly
      - name: Send Email Github Notification
        if: always()
        uses: dawidd6/action-send-mail@v13
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }} #NOT GMAIL PASSWORD!!! USE APP PASSWORD
          subject: Phoenix Inwarranty API Test Report - GitHub Actions
          to: nitin.kr.pathak@gmail.com
          from: Nitin from GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: |
              Hey Team! 👋
              Your API tests just finished running — here's the latest scoop! 🚀
              Check out the full report here: 
              👉 https://nitpathak.github.io/Phoenix-Inwarranty-Flow/
              ✅ All results are in — tap the link above for a full breakdown of
              what passed, what failed, and what needs your attention.

              This is an automated notification from your CI/CD pipeline.
              
              Catch you on the next run! 😄
              — GitHub Actions Bot 🤖
              Phoenix Inwarranty QA Pipeline

          #attachments: newman/index.html
